# Execução da varredura pelo GitHub Actions.
#
# SEM AGENDAMENTO, e a ausência é decisão registrada.
#
# O gatilho `schedule` foi removido porque ligá-lo exigiria guardar o
# NOTION_TOKEN nos segredos deste repositório, que é público. Esse token é um
# Personal Access Token: ele carrega o acesso do usuário que o emitiu ao
# workspace inteiro, e não apenas às três bases do projeto — limitação que a
# seção 5 do documento teórico descreve em detalhe.
#
# Guardar uma credencial de alcance largo em mais um lugar, para ganhar um cron
# num projeto acadêmico, é uma troca ruim. O disparo manual cobre a
# demonstração, e a varredura roda igual pela linha de comando.
#
# Se um dia o PAT for trocado por uma integração interna escopada só à
# página-raiz, a conta muda: aí basta acrescentar de volta
#
#   schedule:
#     - cron: '0 12 * * 1-5'
#
# e configurar os três segredos.

name: Varredura de alertas

on:
  workflow_dispatch:
    inputs:
      secar:
        description: 'Só avaliar, sem gravar no Notion'
        type: boolean
        default: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar varredura
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_RESPONSAVEL_ID: ${{ secrets.NOTION_RESPONSAVEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/varredura.mjs ${{ inputs.secar && '--secar' || '' }}
